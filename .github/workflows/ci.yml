name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atprice
          POSTGRES_PASSWORD: atprice
          POSTGRES_DB: atprice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atprice" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://atprice:atprice@localhost:5432/atprice_test
      TEST_DATABASE_URL: postgres://atprice:atprice@localhost:5432/atprice_test
      NEXT_PUBLIC_ATPRICE_NETWORK: chipnet
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit --prod
