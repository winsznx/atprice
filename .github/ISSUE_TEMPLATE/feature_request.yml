name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like AtPrice to do instead.
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Does this need a contract change?
      description: Anything that changes what the covenant enforces means a new contract version and new order addresses.
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
